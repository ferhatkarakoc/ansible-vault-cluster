---
- name: HashiCorp GPG anahtarını ve repository'sini ekle
  block:
    - name: GPG anahtarları için keyring dizinini oluştur
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: HashiCorp GPG anahtarını indir ve keyring'e kaydet
      ansible.builtin.shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /etc/apt/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg

    - name: HashiCorp repository'sini signed-by ile ekle
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/hashicorp.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main
        owner: root
        group: root
        mode: '0644'

- name: Vault paketini kur
  ansible.builtin.apt:
    name: vault
    state: present
    update_cache: true

- name: TLS sertifikalarını yapılandır
  ansible.builtin.include_tasks: tls.yml

- name: Vault veri dizinini oluştur
  ansible.builtin.file:
    path: /opt/vault/data
    state: directory
    owner: vault
    group: vault
    mode: '0750'

- name: Vault konfigürasyon dosyasını kopyala
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: '0640'
  notify: Restart vault

- name: Vault servisini başlat ve aktif et
  ansible.builtin.systemd:
    name: vault
    state: started
    enabled: true